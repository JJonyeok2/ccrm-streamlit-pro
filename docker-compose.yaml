name: ccrm-streamlit-pro

services:
  streamlit:
    image: python:3.11-slim
    container_name: ccrm_streamlit_pro
    env_file:
      - ./config/.env
    environment:
      PIPELINE_API_BASE_URL: ${DOCKER_PIPELINE_API_BASE_URL:-http://host.docker.internal:18000}
      MLFLOW_TRACKING_URI: ${DOCKER_MLFLOW_TRACKING_URI:-http://host.docker.internal:15000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ccrm_experiment}
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "${STREAMLIT_HOST_PORT:-18501}:${STREAMLIT_SERVER_PORT:-8501}"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      streamlit run streamlit_app/app.py
      --server.address=0.0.0.0
      --server.port=${STREAMLIT_SERVER_PORT:-8501}"
